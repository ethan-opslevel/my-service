name: CI
on:
  pull_request:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in *.sh; do bash -n "$f"; done
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Greeting works
        run: ./greet.sh | grep -q "Hello"
      - name: Changelog convention
        env:
          HEADING: ${{ vars.CHANGELOG_HEADING }}
        run: |
          if [ "$(head -n1 CHANGELOG.md 2>/dev/null)" != "$HEADING" ]; then
            echo "FAIL: CHANGELOG.md must exist and its first line must be exactly: $HEADING"
            exit 1
          fi
          echo "changelog ok"
